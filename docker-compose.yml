networks:
  frontend-net:
    driver: bridge

  backend-net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
    driver: local

services:
  db:
    image: postgres:15-alpine
    container_name: production_db
    restart: always

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: myapp:1.0.0
    restart: always

    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

    networks:
      - frontend-net
      - backend-net

    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    container_name: reverse_proxy
    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - frontend-net

    depends_on:
      - backend
